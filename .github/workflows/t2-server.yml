# Publishes the server archives t2's SSH environments install (see FORK.md).
# scripts/t2-update.sh pushes a `v<upstream nightly>.t2-<commit>` tag; this
# builds the Linux CLI archives the way release-desktop.yml does and attaches
# them, with SHA256SUMS, to that tag's release. Nightly-style tags keep
# release.yml from running on the same push.
name: t2 server

on:
  push:
    tags:
      - "v*.t2-*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - key: linux-x64
            arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          # node-pty compiles from source on Linux, so arm64 builds on arm64.
          - key: linux-arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Resolve version
        run: echo "T2_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install server dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$T2_VERSION"

      # t3#build depends on @t3tools/web#build, so apps/server/dist holds the
      # server bundle and the web client.
      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.rust_target }}

      # vp downloads this exact Node for the single-executable; it must match
      # SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build CLI single-executable
        run: |
          set -euo pipefail
          VP_NODE_VERSION="$(sed -n 's/^const SEA_NODE_VERSION = "\(.*\)";$/\1/p' apps/server/vite.config.ts)"
          [ -n "$VP_NODE_VERSION" ] || { echo "SEA_NODE_VERSION not found in apps/server/vite.config.ts" >&2; exit 1; }
          export VP_NODE_VERSION
          node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor"
          mkdir -p "$monitor_dir/${{ matrix.key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$monitor_dir/${{ matrix.key }}/"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch "${{ matrix.arch }}" \
            --version "$T2_VERSION" \
            --resource-monitor-dir "$monitor_dir" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$T2_VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # The SSH launch script verifies the archive against this file.
      - name: Write checksums
        working-directory: release-assets
        run: sha256sum t3-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "t2 server ${GITHUB_REF_NAME#v}" \
            --notes "Server archives for t2 ${GITHUB_REF_NAME#v}, installed by its SSH environments."
